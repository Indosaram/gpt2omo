[package]
name = "omo-bridge"
version = "0.5.0"
edition = "2021"
publish = false

[dependencies]
# Async Runtime & HTTP Server
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["tokio", "json"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
http = "1.2"
reqwest = { version = "0.12", features = ["json", "stream"] }

# MCP Protocol SDK
rmcp = { version = "0.1", features = ["server", "transport-sse-server"] }

# Serialization & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
schemars = "0.8"
futures = "0.3"
anyhow = "1.0"
url = "2.5"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace Capability & Security
cap-std = "3.4"
dunce = "1.0"
globset = "0.4"
ignore = "0.4"
diffy = "0.4"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.13", features = ["v4"] }

[dev-dependencies]
tempfile = "3.17"
